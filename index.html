<style>
/* ========== 末地星空设计令牌 ========== */
:root {
  /* 深紫虚空底 — 降低紫色，改为深蓝更沉稳 */
  --void: #0f0d1f;
  --void-2: #171530;
  --void-3: #1e1c3e;
  --obsidian: #181330;
  --obsidian-2: #25204a;
  /* 主色：末影蓝 + 星环紫 （去掉刺眼的绿色） */
  --ender: #5a8dff;        /* 主色：星空蓝，7.3:1对比度在深底可读 */
  --ender-dark: #2d5fda;
  --ender-glow: rgba(90,141,255,0.18);
  --purple: #a78bfa;       /* 辅色：薰衣草紫，和蓝和谐 */
  --purple-dark: #7c3aed;
  --purple-glow: rgba(167,139,250,0.18);
  --magenta: #f472b6;
  --gold: #fcd34d;         /* 金色点缀，更柔和 */
  --star: rgba(255,255,255,0.9);
  /* 卡片 & 边框 — 稍亮一档，和背景差 0.15 灰度保持层次 */
  --card: rgba(30,28,62,0.7);
  --card-hover: rgba(38,35,80,0.8);
  --border: rgba(167,139,250,0.22);
  --border-bright: rgba(90,141,255,0.4);
  /* 文字 — 提亮一档，确保 4.5:1 WCAG AA */
  --text: #ffffff;         /* 正文：纯白 */
  --text-2: #d4d1e5;       /* 二级：淡紫灰，对比度 10.2:1 达标 */
  --text-3: #938fb0;       /* 三级：中紫灰，对比度 6.2:1 达标 */
  --radius: 10px;
  --shadow-float: 0 8px 28px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 24px rgba(90,141,255,0.18);
  --shadow-purple: 0 0 24px rgba(167,139,250,0.18);
  --transition: 200ms cubic-bezier(0.4,0,0.2,1);
  --font-display: "Georgia", "Noto Serif SC", "Microsoft YaHei", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Code", "JetBrains Mono", "Consolas", "Courier New", monospace;
  --max-w: 880px;
}
[data-theme="light"] {
  --void: #f4f2fb;
  --void-2: #ebe7f8;
  --void-3: #e0daf5;
  --card: rgba(255,255,255,0.85);
  --card-hover: rgba(255,255,255,0.95);
  --border: rgba(124,58,237,0.18);
  --border-bright: rgba(45,95,218,0.35);
  --text: #131026;
  --text-2: #3d3660;
  --text-3: #746e92;
  --shadow-float: 0 6px 20px rgba(40,30,80,0.08);
  /* 浅色模式下强调色加深，确保白底可读 */
  --ender: #2563eb;        /* 深蓝，对比度 5.9:1 达标 */
  --ender-dark: #1d4ed8;
  --ender-glow: rgba(37,99,235,0.12);
  --purple: #7c3aed;       /* 深紫，对比度 5.9:1 达标 */
  --purple-dark: #6d28d9;
  --purple-glow: rgba(124,58,237,0.12);
  --gold: #b45309;         /* 深琥珀，对比度 5.8:1 达标 */
  --magenta: #be185d;
  --star: rgba(80,60,120,0.3);
}
/* 浅色模式浮岛卡片 fallback */
[data-theme="light"] .floating-card {
  background: #ffffff;
  background: rgba(255,255,255,0.88);
}
[data-theme="light"] .hero-quote {
  background: #ffffff;
  background: rgba(255,255,255,0.88);
}
/* 浅色模式龙鳞卡片 — 白底替代深色 */
[data-theme="light"] .dragon-card {
  background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(244,242,251,0.95));
  border-color: rgba(37,99,235,0.2);
}
[data-theme="light"] .dragon-banner {
  background: #e8e4f5;
}

/* ========== 重置 ========== */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--void);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
}
/* 末地星空背景 */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(167,139,250,0.14), rgba(15,13,31,0) 50%),
    radial-gradient(ellipse at 20% 100%, rgba(90,141,255,0.1), rgba(15,13,31,0) 50%),
    radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.06), rgba(15,13,31,0) 50%),
    linear-gradient(180deg, #0f0d1f 0%, #171530 50%, #0f0d1f 100%);
  z-index: 0;
}
/* 星点粒子 */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), rgba(255,255,255,0)),
    radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.8), rgba(255,255,255,0)),
    radial-gradient(1px 1px at 45% 15%, rgba(255,255,255,0.6), rgba(255,255,255,0)),
    radial-gradient(1px 1px at 65% 75%, rgba(255,255,255,0.8), rgba(255,255,255,0)),
    radial-gradient(1px 1px at 80% 35%, rgba(167,139,250,0.5), rgba(167,139,250,0)),
    radial-gradient(1px 1px at 90% 60%, rgba(90,141,255,0.5), rgba(90,141,255,0)),
    radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.5), rgba(255,255,255,0)),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.8), rgba(255,255,255,0)),
    radial-gradient(1px 1px at 35% 90%, rgba(167,139,250,0.4), rgba(167,139,250,0)),
    radial-gradient(1px 1px at 75% 10%, rgba(90,141,255,0.4), rgba(90,141,255,0)),
    radial-gradient(2px 2px at 5% 50%, rgba(252,211,77,0.3), rgba(252,211,77,0)),
    radial-gradient(2px 2px at 95% 25%, rgba(244,114,182,0.3), rgba(244,114,182,0));
  background-size: 100% 100%;
  pointer-events: none;
  z-index: 0;
  animation: twinkle 8s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.5; }
  100% { opacity: 1; }
}
/* ========== 末地装饰物 ========== */
.end-deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.12;
  image-rendering: pixelated;
  image-rendering: crisp-edges; /* Firefox 兼容 */
  -webkit-image-rendering: pixelated; /* Safari 兼容 */
}
.end-deco svg { width: 100%; height: 100%; display: block; }
.deco-endstone-1 { top: 8%; left: 3%; width: 48px; height: 48px; transform: rotate(-12deg); }
.deco-endstone-2 { top: 30%; right: 4%; width: 40px; height: 40px; transform: rotate(15deg); }
.deco-endstone-3 { bottom: 25%; left: 5%; width: 36px; height: 36px; transform: rotate(8deg); }
.deco-enderman { top: 55%; right: 2%; width: 44px; height: 60px; opacity: 0.08; }
.deco-shulker { bottom: 10%; right: 6%; width: 36px; height: 42px; opacity: 0.1; }
.deco-pearl { top: 18%; left: 8%; width: 24px; height: 24px; opacity: 0.15; animation: float 4s ease-in-out infinite; will-change: transform; }
.deco-pearl2 { top: 75%; left: 10%; width: 20px; height: 20px; opacity: 0.12; animation: float 5s ease-in-out infinite 1s; will-change: transform; }
/* 新增末地石制品 */
.deco-endstone-brick { top: 45%; left: 6%; width: 40px; height: 40px; transform: rotate(-8deg); }
.deco-end-rod { top: 14%; right: 9%; width: 14px; height: 56px; opacity: 0.18; animation: glow 3s ease-in-out infinite; will-change: opacity, filter; }
.deco-purpur { top: 68%; left: 4%; width: 36px; height: 36px; transform: rotate(10deg); }
.deco-portal-frame { top: 22%; right: 11%; width: 44px; height: 44px; opacity: 0.14; }
.deco-dragon-egg { bottom: 38%; right: 3%; width: 32px; height: 40px; opacity: 0.16; animation: float 6s ease-in-out infinite; will-change: transform; }
.deco-end-crystal { top: 50%; left: 13%; width: 30px; height: 30px; opacity: 0.18; animation: float 4.5s ease-in-out infinite 0.5s; will-change: transform; }
/* 新增末影人 2 — 左下角 */
.deco-enderman-2 { bottom: 18%; left: 8%; width: 38px; height: 52px; opacity: 0.07; transform: scaleX(-1); }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes glow {
  0%, 100% { opacity: 0.15; filter: drop-shadow(0 0 4px rgba(255,255,255,0.4)); }
  50% { opacity: 0.25; filter: drop-shadow(0 0 12px rgba(167,139,250,0.6)); }
}
/* 浅色模式下降低装饰物不透明度，避免干扰阅读 */
[data-theme="light"] .end-deco { opacity: 0.08; }
[data-theme="light"] .deco-enderman,
[data-theme="light"] .deco-enderman-2 { opacity: 0.05; }
[data-theme="light"] .deco-pearl,
[data-theme="light"] .deco-pearl2,
[data-theme="light"] .deco-end-crystal,
[data-theme="light"] .deco-dragon-egg { opacity: 0.1; }
/* 移动端：装饰移到更靠中间的位置，保留 6 个浮动小装饰 */
@media (max-width: 600px) {
  .deco-endstone-1, .deco-endstone-3,
  .deco-endstone-brick, .deco-portal-frame,
  .deco-enderman, .deco-enderman-2, .deco-shulker { display: none; }
  .deco-pearl { width: 18px; height: 18px; left: 24%; top: 14%; }
  .deco-pearl2 { width: 18px; height: 18px; left: 58%; top: 72%; }
  .deco-end-crystal { width: 22px; height: 22px; left: 42%; top: 30%; }
  .deco-dragon-egg { width: 24px; height: 30px; right: 26%; bottom: 20%; }
  .deco-purpur { display: block; width: 26px; height: 26px; left: 30%; top: 84%; }
  .deco-endstone-2 { display: block; width: 28px; height: 28px; left: 66%; top: 10%; }
  .deco-end-rod { display: none; }
}
/* 手机端装饰轻微右移避免与文字重叠 */
@media (max-width: 600px) {
  .deco-pearl { left: 26%; }
  .deco-endstone-2 { left: 68%; }
}
/* 极小屏：全部隐藏 */
@media (max-width: 380px) { .end-deco { display: none !important; } }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul { list-style: none; }

/* ========== 导航栏 ========== */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: #0a0612; /* 旧设备 fallback */
  background: rgba(10,6,18,0.88); /* 不支持 blur 时高不透明度保证可读 */
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}
[data-theme="light"] .navbar {
  background: #ede8f5;
  background: rgba(237,232,245,0.92);
}
.nav-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 20px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.nav-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  background: linear-gradient(135deg, var(--ender), var(--purple));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--ender);
  white-space: nowrap;
  letter-spacing: 1px;
}
.nav-links { display: flex; gap: 2px; align-items: center; }
.nav-links a {
  padding: 6px 12px;
  font-size: 0.85rem;
  color: var(--text-2);
  border-radius: var(--radius);
  transition: all var(--transition);
  white-space: nowrap;
}
.nav-links a:hover {
  color: var(--ender);
  background: var(--ender-glow);
}
.nav-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(26,16,48,0.5);
  color: var(--text-2);
  transition: all var(--transition);
}
.icon-btn:hover {
  color: var(--ender);
  border-color: var(--border-bright);
  box-shadow: var(--shadow-glow);
}
.icon-btn svg { width: 18px; height: 18px; }
.nav-toggle { display: none; }
@media (max-width: 768px) {
  .nav-links {
    position: fixed;
    top: 54px; left: 0; right: 0;
    background: rgba(10,6,18,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-direction: column;
    padding: 12px 20px;
    gap: 2px;
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
    transition: all 300ms ease;
  }
  .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .nav-links a { padding: 10px 12px; font-size: 0.95rem; width: 100%; }
  .nav-toggle {
    display: flex;
    width: 36px; height: 36px;
    align-items: center; justify-content: center;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(26,16,48,0.5);
    color: var(--text-2);
  }
}

/* ========== 主容器 ========== */
main { position: relative; z-index: 1; padding-top: 54px; }
section {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 48px 20px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  color: var(--text);
}
.section-title .label {
  color: var(--ender);
}
.section-title::before, .section-title::after {
  content: '';
  height: 1px;
  flex: 1;
  max-width: 60px;
  background: linear-gradient(90deg, rgba(167,139,250,0), rgba(167,139,250,0.5), rgba(167,139,250,0));
}
.section-title .label {
  position: relative;
  padding: 4px 16px;
}
.section-title .label::after {
  content: attr(data-en);
  display: block;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-3);
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ========== 浮岛卡片基础 ========== */
.floating-card {
  background: #1a1030; /* 旧设备 fallback 实色 */
  background: rgba(26,16,48,0.85); /* 无 blur 时高不透明度 */
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
@supports ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
  .floating-card {
    background: rgba(26,16,48,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
}
.floating-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, rgba(90,141,255,0.04), rgba(90,141,255,0) 50%, rgba(167,139,250,0.04));
  pointer-events: none;
  border-radius: var(--radius);
}
.floating-card:hover {
  border-color: var(--border-bright);
  box-shadow: var(--shadow-glow);
  transform: translateY(-3px);
}

/* ========== Hero 区 ========== */
.hero {
  text-align: center;
  padding: 60px 20px 40px;
  position: relative;
}
/* 末地传送门光圈 */
.hero::before {
  content: '';
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(90,141,255,0.18) 0%, rgba(167,139,250,0.18) 40%, rgba(15,13,31,0) 70%);
  filter: blur(20px);
  z-index: -1;
  animation: pulse 6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
  50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
}
.hero-avatar {
  width: 88px; height: 88px;
  margin: 0 auto 16px;
  border-radius: 50%;
  border: 2px solid var(--border-bright);
  box-shadow: 0 0 20px var(--ender-glow), 0 4px 16px rgba(0,0,0,0.3);
  overflow: hidden;
  position: relative;
}
.hero-avatar svg { width: 100%; height: 100%; display: block; }
.hero-name {
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text) 20%, var(--ender) 55%, var(--purple) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--text);
}
.hero-tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
}
.hero-tags .tag {
  font-family: var(--font-mono);
  padding: 5px 14px;
  font-size: 0.75rem;
  border-radius: 20px;
  background: rgba(90,141,255,0.08);
  color: var(--ender);
  border: 1px solid rgba(90,141,255,0.2);
  letter-spacing: 0.5px;
}
.hero-tags .tag.purple {
  background: rgba(167,139,250,0.08);
  color: var(--purple);
  border-color: rgba(167,139,250,0.2);
}
.hero-tags .tag.gold {
  background: rgba(252,211,77,0.08);
  color: var(--gold);
  border-color: rgba(252,211,77,0.2);
}
.hero-quote {
  font-size: 1.1rem;
  line-height: 1.8;
  color: var(--text);
  max-width: 640px;
  margin: 0 auto 24px;
  font-weight: 500;
  padding: 20px 24px;
  background: #1a1030;
  background: rgba(26,16,48,0.85);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  position: relative;
}
@supports ((backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px))) {
  .hero-quote {
    background: rgba(26,16,48,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
}
.hero-quote::before {
  content: '"';
  position: absolute;
  top: -8px; left: 12px;
  font-family: var(--font-display);
  font-size: 2.5rem;
  color: var(--purple);
  opacity: 0.4;
}
.hero-desc {
  font-size: 0.92rem;
  color: var(--text-2);
  max-width: 560px;
  margin: 0 auto 28px;
  line-height: 1.8;
}
.hero-contact {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border-radius: var(--radius);
  font-size: 0.88rem;
  font-weight: 500;
  transition: all var(--transition);
  min-height: 44px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--ender), var(--purple));
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 16px var(--ender-glow);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px var(--ender-glow); }
.btn-outline {
  border: 1px solid var(--border-bright);
  color: var(--ender);
  background: var(--ender-glow);
  font-weight: 600;
}
.btn-outline:hover { border-color: var(--ender); background: var(--ender-glow); color: var(--text); }
.btn svg { width: 16px; height: 16px; }

/* ========== 亮点成果 — 对称四方格 ========== */
.highlights {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 600px;
  margin: 0 auto;
}
@media (min-width: 600px) {
  .highlights { grid-template-columns: repeat(4, 1fr); }
}
.highlight-card {
  padding: 20px 12px;
  text-align: center;
}
.highlight-num {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold), var(--ender));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--gold); /* fallback */
  line-height: 1.3;
}
.highlight-label {
  font-size: 0.82rem;
  color: var(--text-2);
  margin-top: 4px;
}

/* ========== 末影龙游戏展示区 ========== */
.dragon-showcase {
  position: relative;
  padding: 36px 20px 32px;
  margin: 0 auto 8px;
  max-width: var(--max-w);
  overflow: hidden;
}
/* 龙息能量条 — 顶部渐变光带 */
.dragon-showcase::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 80%; height: 2px;
  background: linear-gradient(90deg, rgba(90,141,255,0), var(--ender), var(--purple), var(--ender), rgba(90,141,255,0));
  box-shadow: 0 0 12px var(--ender-glow);
}
.dragon-title {
  text-align: center;
  margin-bottom: 24px;
}
.dragon-title h2 {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--ender);
  margin-bottom: 4px;
  letter-spacing: 2px;
}
.dragon-title p {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-3);
  letter-spacing: 2px;
  text-transform: uppercase;
}
/* 龙翼装饰 */
.dragon-wing {
  display: inline-block;
  vertical-align: middle;
  width: 28px; height: 20px;
  opacity: 0.5;
  margin: 0 8px;
}
.dragon-wing svg { width: 100%; height: 100%; }

.dragon-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  max-width: 720px;
  margin: 0 auto;
}
@media (min-width: 680px) {
  .dragon-grid { grid-template-columns: 1fr 1fr; }
}
/* 龙鳞卡片 */
.dragon-card {
  position: relative;
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(90,141,255,0.3);
  border-radius: var(--radius);
  background: linear-gradient(160deg, rgba(30,28,62,0.9), rgba(20,16,48,0.95));
  transition: all var(--transition);
}
@supports ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
  .dragon-card {
    background: linear-gradient(160deg, rgba(30,28,62,0.75), rgba(20,16,48,0.8));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
}
.dragon-card:hover {
  border-color: rgba(90,141,255,0.6);
  box-shadow: 0 0 28px rgba(90,141,255,0.2), 0 8px 32px rgba(0,0,0,0.4);
  transform: translateY(-4px);
}
/* 卡片顶 banner — 像素游戏缩略图区 */
.dragon-banner {
  height: 100px;
  position: relative;
  overflow: hidden;
  background: #0a0a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dragon-banner svg { width: 100%; height: 100%; }
/* banner 渐变遮罩 */
.dragon-banner::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, rgba(20,16,48,0), rgba(20,16,48,0.95));
}
[data-theme="light"] .dragon-banner::after {
  background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.95));
}
.dragon-body { padding: 16px 18px 18px; }
.dragon-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dragon-name .badge {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--ender-glow);
  color: var(--ender);
  border: 1px solid var(--border-bright);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.dragon-desc {
  font-size: 0.85rem;
  color: var(--text-2);
  line-height: 1.7;
  margin-bottom: 10px;
}
.dragon-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.dragon-stat {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--purple-glow);
  color: var(--purple);
  border: 1px solid var(--border);
}
.dragon-play {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--ender), var(--purple));
  color: #ffffff;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  transition: all var(--transition);
  box-shadow: 0 3px 12px var(--ender-glow);
}
.dragon-play:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px var(--ender-glow);
}
.dragon-play svg { width: 14px; height: 14px; }

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  justify-content: center;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 8px 20px;
  font-size: 0.88rem;
  color: var(--text-2);
  border-radius: 20px;
  border: 1px solid transparent;
  transition: all var(--transition);
  min-height: 40px;
  display: flex;
  align-items: center;
}
.tab-btn:hover { color: var(--text); background: rgba(167,139,250,0.06); }
.tab-btn[aria-selected="true"] {
  color: #fff;
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  border-color: rgba(167,139,250,0.3);
  box-shadow: var(--shadow-purple);
}
.tab-panel { display: none; animation: fadeIn 250ms ease; }
.tab-panel.active { display: block; }

/* ========== 时间线 ========== */
.timeline { position: relative; padding-left: 24px; max-width: 640px; margin: 0 auto; }
.timeline::before {
  content: '';
  position: absolute;
  left: 5px; top: 4px; bottom: 4px;
  width: 2px;
  background: linear-gradient(180deg, var(--ender), var(--purple), rgba(15,13,31,0));
}
.timeline-item { position: relative; padding-bottom: 28px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before {
  content: '';
  position: absolute;
  left: -23px; top: 4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--void-2);
  border: 2px solid var(--ender);
  box-shadow: 0 0 8px var(--ender-glow);
  transition: all var(--transition);
}
.timeline-item:hover::before {
  background: var(--ender);
  box-shadow: 0 0 0 4px var(--ender-glow), 0 0 12px var(--ender);
}
.timeline-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 4px; }
.timeline-title {
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--gold);          /* 金色，醒目且有荣誉感 */
  letter-spacing: 0.5px;
}
.timeline-org { color: var(--ender); font-size: 0.85rem; }
.timeline-date { font-size: 0.8rem; color: var(--text-3); font-family: var(--font-mono); }
.timeline-desc { font-size: 0.88rem; color: var(--text-2); line-height: 1.7; }
.timeline-desc li { margin-bottom: 4px; padding-left: 14px; position: relative; }
.timeline-desc li::before { content: '◆'; position: absolute; left: 0; font-size: 0.6rem; color: var(--purple); top: 3px; }

/* ========== 项目卡片 ========== */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.project-card { padding: 20px; display: flex; flex-direction: column; }
.project-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(90,141,255,0.12), rgba(167,139,250,0.12));
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
.project-icon svg { width: 22px; height: 22px; color: var(--ender); }
.project-name { font-weight: 600; font-size: 1.02rem; margin-bottom: 6px; }
.project-desc { font-size: 0.86rem; color: var(--text-2); line-height: 1.7; margin-bottom: 12px; flex: 1; }
.project-tech { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tech-badge {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(167,139,250,0.08);
  color: var(--purple);
  border: 1px solid rgba(167,139,250,0.15);
}
.project-result {
  font-size: 0.82rem;
  color: var(--ender);
  padding: 8px 12px;
  background: rgba(90,141,255,0.06);
  border-radius: var(--radius);
  border-left: 2px solid var(--ender);
  margin-bottom: 10px;
}
.project-link {
  align-self: flex-start;
  padding: 8px 18px;
  font-size: 0.82rem;
}
.project-link svg { width: 14px; height: 14px; }

/* ========== 技能矩阵 ========== */
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}
@media (min-width: 640px) {
  .skill-grid { grid-template-columns: repeat(2, 1fr); }
}
.skill-group h4 {
  font-size: 0.9rem;
  color: var(--ender);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
.skill-group h4 svg { width: 16px; height: 16px; color: var(--purple); }
.skill-bar { margin-bottom: 12px; }
.skill-bar-name { display: flex; justify-content: space-between; font-size: 0.84rem; margin-bottom: 4px; color: var(--text); }
.skill-bar-name span:last-child { color: var(--gold); font-family: var(--font-mono); }
.skill-bar-track {
  height: 6px;
  background: rgba(10,6,18,0.5);
  border-radius: 3px;
  overflow: hidden;
}
.skill-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--ender), var(--purple));
  width: 0;
  transition: width 800ms cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 8px var(--ender-glow);
}
.skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.skill-tag {
  padding: 5px 12px;
  font-size: 0.8rem;
  border-radius: var(--radius);
  background: var(--ender-glow);
  color: var(--ender);
  border: 1px solid var(--border-bright);
  font-weight: 500;
  transition: all var(--transition);
}
.skill-tag:hover { border-color: var(--ender); color: var(--text); background: var(--ender-glow); }

/* ========== 证书 — 成就画廊 ========== */
.cert-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.cert-card {
  padding: 14px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  cursor: zoom-in;
  position: relative;
  transition: all var(--transition);
}
.cert-card:hover {
  box-shadow: var(--shadow-purple);
  transform: translateY(-2px);
  border-color: var(--border-bright);
}
.cert-card:hover .cert-name { color: var(--gold); }
/* 左侧证书图标 */
.cert-icon {
  width: 38px; height: 38px;
  flex-shrink: 0;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(252,211,77,0.15), rgba(167,139,250,0.1));
  border: 1px solid rgba(252,211,77,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.cert-card:hover .cert-icon {
  background: linear-gradient(135deg, rgba(252,211,77,0.25), rgba(167,139,250,0.15));
  box-shadow: 0 0 12px rgba(252,211,77,0.2);
}
.cert-icon svg { width: 20px; height: 20px; color: var(--gold); }
/* 文字信息 */
.cert-info { flex: 1; min-width: 0; }
.cert-name {
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 2px;
  color: var(--text);
  transition: color var(--transition);
}
.cert-issuer { font-size: 0.78rem; color: var(--gold); }
.cert-date { font-size: 0.72rem; color: var(--text-3); font-family: var(--font-mono); margin-top: 2px; }
.cert-desc { font-size: 0.78rem; color: var(--text-2); margin-top: 4px; line-height: 1.55; }
/* 右侧放大提示 */
.cert-zoom-hint {
  flex-shrink: 0;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  opacity: 0.5;
  transition: all var(--transition);
  align-self: center;
}
.cert-card:hover .cert-zoom-hint {
  opacity: 1;
  color: var(--ender);
  background: var(--ender-glow);
}
.cert-zoom-hint svg { width: 14px; height: 14px; }
/* 证书占位提示 */
.cert-placeholder {
  padding: 24px;
  text-align: center;
  border: 1px dashed var(--border-bright);
  background: rgba(90,141,255,0.03);
  grid-column: 1 / -1;
}
.cert-placeholder-text {
  font-size: 0.88rem;
  color: var(--text-2);
}
.cert-placeholder-text strong { color: var(--ender); }

/* ========== 证书 Lightbox ========== */
.cert-lightbox {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 200;
  background: rgba(5,3,12,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.cert-lightbox.show { opacity: 1; pointer-events: auto; }
.cert-lightbox img {
  display: block;
  margin: auto;
  max-width: 100%;
  max-height: 86vh;
  border-radius: var(--radius);
  border: 1px solid var(--border-bright);
  box-shadow: 0 12px 48px rgba(0,0,0,0.6), 0 0 32px var(--ender-glow);
  object-fit: contain;
}
.cert-lightbox-close {
  position: absolute;
  top: 20px; right: 24px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(30,28,62,0.8);
  border: 1px solid var(--border-bright);
  color: var(--text);
  font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all var(--transition);
}
.cert-lightbox-close:hover { background: var(--ender-glow); color: var(--ender); transform: rotate(90deg); }
.cert-lightbox-caption {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  padding: 8px 16px;
  background: rgba(30,28,62,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.85rem;
  color: var(--text-2);
  text-align: center;
  max-width: 90%;
}
.cert-lightbox-caption strong { color: var(--gold); }

/* ========== 教育 ========== */
.edu-grid { display: grid; gap: 14px; max-width: 680px; margin: 0 auto; }
.edu-card { padding: 20px; }
.edu-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 6px; }
.edu-school { font-weight: 600; font-size: 1rem; }
.edu-period { font-size: 0.78rem; color: var(--text-3); font-family: var(--font-mono); }
.edu-major { color: var(--ender); font-size: 0.88rem; margin-bottom: 6px; }
.edu-desc { font-size: 0.86rem; color: var(--text-2); line-height: 1.8; }

/* ========== 兴趣爱好 — 五角对称 ========== */
.hobby-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  max-width: 760px;
  margin: 0 auto;
}
.hobby-card { padding: 16px 10px; text-align: center; }
.hobby-icon {
  width: 40px; height: 40px;
  margin: 0 auto 8px;
  border-radius: 50%;
  border: 1px solid var(--border-bright);
  background: linear-gradient(135deg, rgba(90,141,255,0.1), rgba(167,139,250,0.1));
  display: flex;
  align-items: center;
  justify-content: center;
}
.hobby-icon svg { width: 18px; height: 18px; }
.hobby-card:nth-child(1) .hobby-icon svg { color: var(--ender); }
.hobby-card:nth-child(2) .hobby-icon svg { color: var(--purple); }
.hobby-card:nth-child(3) .hobby-icon svg { color: var(--gold); }
.hobby-card:nth-child(4) .hobby-icon svg { color: var(--magenta); }
.hobby-card:nth-child(5) .hobby-icon svg { color: var(--ender); }
.hobby-name { font-size: 0.88rem; font-weight: 600; }
.hobby-desc { font-size: 0.74rem; color: var(--text-3); margin-top: 2px; }

/* ========== 页脚 ========== */
footer {
  text-align: center;
  padding: 40px 20px 32px;
  margin-top: 20px;
  position: relative;
}
footer::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 1px;
  background: linear-gradient(90deg, rgba(167,139,250,0), rgba(167,139,250,0.5), rgba(167,139,250,0));
}
.footer-motto {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--ender) 0%, var(--purple) 50%, var(--gold) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--ender); /* fallback */
  filter: drop-shadow(0 0 12px var(--ender-glow));
}
.footer-info { font-size: 0.78rem; color: var(--text-3); font-family: var(--font-mono); }

/* ========== 返回顶部 ========== */
.back-top {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ender), var(--purple));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(90,141,255,0.3);
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
  transition: all var(--transition);
  z-index: 90;
}
.back-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.back-top svg { width: 20px; height: 20px; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-bright);
  color: var(--text);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 0.88rem;
  box-shadow: var(--shadow-float);
  opacity: 0;
  pointer-events: none;
  transition: all 250ms ease;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 动画 ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 500ms ease, transform 500ms ease; }
.reveal.visible { opacity: 1; transform: none; }

/* ========== 旧设备兼容降级 ========== */
/* 不支持 CSS Grid 的浏览器使用 flex 布局 */
@supports not (display: grid) {
  .highlights, .project-grid, .skill-grid, .cert-grid, .edu-grid, .hobby-grid {
    display: flex;
    flex-wrap: wrap;
  }
  .highlights > *, .project-grid > *, .skill-grid > *, .cert-grid > *, .edu-grid > *, .hobby-grid > * {
    flex: 1 1 200px;
    margin: 6px;
  }
}
/* 不支持 filter:blur 的设备隐藏光圈，避免布局异常 */
@supports not (filter: blur(1px)) {
  .hero::before { display: none; }
}
/* flexbox gap 不支持时用 margin 替代 */
@supports not (gap: 1px) {
  .nav-links > * + * { margin-left: 2px; }
  .hero-tags > * + * { margin-left: 8px; }
  .hero-contact > * + * { margin-left: 12px; }
  .tabs > * + * { margin-left: 4px; }
}

/* ========== 打印 ========== */
@media print {
  body { background: #fff; color: #1a0d2e; font-size: 12px; }
  body::before, body::after { display: none; }
  .navbar, .back-top, .nav-actions, .hero-contact, .toast { display: none !important; }
  section { padding: 12px 0; page-break-inside: avoid; }
  .tab-panel { display: block !important; }
  .tab-btn { display: none; }
  .floating-card { border: 1px solid #ccc; box-shadow: none; }
  .hero-name, .highlight-num, .footer-motto { -webkit-text-fill-color: #1a0d2e; filter: none; }
  .cert-lightbox { display: none !important; }
  .cert-card { cursor: default; page-break-inside: avoid; }

}
@media (prefers-reduced-motion: reduce) {

/* ========== 交互动画增强 ========== */
/* 顶部阅读进度条 */
#scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--ender), var(--purple), var(--magenta));
  z-index: 200; border-radius: 0 3px 3px 0;
  box-shadow: 0 0 10px var(--ender-glow);
  pointer-events: none;
}
/* 鼠标跟随光晕 */
#cursor-glow {
  position: fixed; left: 0; top: 0; width: 360px; height: 360px;
  border-radius: 50%; pointer-events: none; z-index: 3;
  background: radial-gradient(circle, rgba(90,141,255,0.10) 0%, rgba(167,139,250,0.06) 45%, transparent 70%);
  opacity: 0.7; transition: opacity 400ms ease;
}
[data-theme="light"] #cursor-glow {
  background: radial-gradient(circle, rgba(90,141,255,0.10) 0%, rgba(124,58,237,0.05) 45%, transparent 70%);
}
/* 星尘粒子 */
.stardust {
  position: fixed; z-index: 9998; pointer-events: none;
  border-radius: 50%;
  animation: stardust-rise 0.8s ease-out forwards;
  box-shadow: 0 0 8px currentColor;
}
@keyframes stardust-rise {
  0% { opacity: 0.95; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-28px) scale(0.15); }
}
/* 卡片 3D 倾斜 */
.floating-card, .dragon-card {
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px));
  transition: transform 260ms ease, border-color var(--transition), box-shadow var(--transition);
  will-change: transform;
}
.floating-card:hover { --ty: -3px; }
.dragon-card:hover { --ty: -4px; }
/* 按钮悬停微动 */
.btn, .tab-btn, .icon-btn {
  transition: transform 180ms ease, color var(--transition), background var(--transition),
              border-color var(--transition), box-shadow var(--transition);
}
.btn:hover, .tab-btn:hover, .icon-btn:hover { transform: scale(1.05); }
.btn:active, .tab-btn:active, .icon-btn:active { transform: scale(0.96); }
/* 主题切换图标旋转 */
#themeToggle svg { transition: transform 450ms cubic-bezier(0.34, 1.56, 0.64, 1); }
#themeToggle.spin svg { transform: rotate(180deg); }
/* 卡片交错渐入 */
.reveal.visible .floating-card,
.reveal.visible .skill-group,
.reveal.visible .edu-card,
.reveal.visible .hobby-card {
  animation: card-in 520ms cubic-bezier(0.22, 0.9, 0.35, 1) backwards;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 技能数字 */
.skill-pct { min-width: 38px; text-align: right; }
.skill-bar:hover .skill-bar-fill {
  filter: brightness(1.25);
  box-shadow: 0 0 14px var(--ender-glow), 0 0 4px var(--purple-glow);
}
.skill-bar:hover .skill-bar-name span:first-child { color: var(--ender); }
/* 打印/降级 */
@media print {
  #cursor-glow, .stardust, #scroll-progress { display: none !important; }
  .reveal { opacity: 1 !important; transform: none !important; }
  .reveal.visible .floating-card, .reveal.visible .skill-group,
  .reveal.visible .edu-card, .reveal.visible .hobby-card { animation: none !important; }
  .floating-card, .dragon-card { transform: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  #cursor-glow, .stardust { display: none !important; }
}

/* ===== 迷你音乐播放器（悬浮窗） ===== */

}

// 证书 Lightbox 控制
function setupCertLightbox(sec, certs) {
  const lb = sec.querySelector('#certLightbox');
  const lbImg = sec.querySelector('#certLightboxImg');
  const lbCap = sec.querySelector('#certLightboxCaption');
  const lbClose = sec.querySelector('#certLightboxClose');
  if (!lb || !lbImg) return;
  const open = (idx) => {
    const c = certs[idx];
    if (!c) return;
    lbImg.src = encodeURI(c.img);
    lbImg.alt = `${c.name} - ${c.issuer}`;
    lbCap.innerHTML = `<strong>${c.name}</strong> · ${c.issuer} · ${c.date}`;
    lb.classList.add('show');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  };
  const close = () => {
    lb.classList.remove('show');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lbImg.src = '';
  };
  sec.querySelectorAll('.cert-card').forEach(card => {
    card.addEventListener('click', () => open(parseInt(card.dataset.certIdx, 10)));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(parseInt(card.dataset.certIdx, 10)); }
    });
  });
  lbClose.addEventListener('click', close);
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lb.classList.contains('show')) close();
  });
}

function initTabs(container) {
  const tabBtns = container.querySelectorAll('.tab-btn');
  const panels = container.querySelectorAll('.tab-panel');
  tabBtns.forEach((btn, idx) => {
    btn.addEventListener('click', () => switchTab(tabBtns, panels, idx));
    btn.addEventListener('keydown', (e) => {
      let newIdx = idx;
      if (e.key === 'ArrowRight') newIdx = (idx + 1) % tabBtns.length;
      else if (e.key === 'ArrowLeft') newIdx = (idx - 1 + tabBtns.length) % tabBtns.length;
      else if (e.key === 'Home') newIdx = 0;
      else if (e.key === 'End') newIdx = tabBtns.length - 1;
      else return;
      e.preventDefault();
      switchTab(tabBtns, panels, newIdx);
      tabBtns[newIdx].focus();
    });
  });
}
function switchTab(btns, panels, idx) {
  btns.forEach((b, i) => { b.setAttribute('aria-selected', i === idx); b.setAttribute('tabindex', i === idx ? 0 : -1); });
  panels.forEach((p, i) => p.classList.toggle('active', i === idx));
}
document.querySelectorAll('section').forEach(s => { if (s.querySelector('.tabs')) initTabs(s); });

function animatePct(el, target, dur) {
  const t0 = performance.now();
  const step = (t) => {
    const pr = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - pr, 3);
    el.textContent = Math.round(eased * target) + '%';
    if (pr < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      // 技能进度条 + 数字滚动
      e.target.querySelectorAll('.skill-bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.level + '%';
        const pct = bar.closest('.skill-bar') && bar.closest('.skill-bar').querySelector('.skill-pct');
        if (pct) animatePct(pct, +bar.dataset.level, 900);
      });
      // 卡片交错渐入
      e.target.querySelectorAll('.floating-card, .skill-group, .edu-card, .hobby-card').forEach((c, i) => {
        c.style.animationDelay = (i * 70) + 'ms';
      });
      observer.unobserve(e.target);
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

let lastDust = 0;
const DUST_COLORS = ['#fcd34d', '#5a8dff', '#a78bfa', '#f472b6'];
document.addEventListener('mousemove', (e) => {
  const now = performance.now();
  if (now - lastDust < 60) return;

  if (!e.target.closest('button, a, .floating-card, .dragon-card, .cert-card, .tab-btn, .skill-tag')) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  lastDust = now;
  const d = document.createElement('i');
  d.className = 'stardust';
  const s = 2 + Math.random() * 3.5;
  d.style.cssText = 'left:' + e.clientX + 'px;top:' + e.clientY + 'px;width:' + s + 'px;height:' + s + 'px;'
    + 'background:' + DUST_COLORS[Math.floor(Math.random() * DUST_COLORS.length)]
    + ';animation-duration:' + (0.5 + Math.random() * 0.5) + 's;animation-delay:' + (Math.random() * 0.08) + 's';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}, { passive: true });

// ========== 卡片 3D 倾斜（跟随鼠标） ==========
if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
  document.addEventListener('mousemove', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.floating-card, .dragon-card') : null;
    if (!card) return;
    const r = card.getBoundingClientRect();
    if (r.width === 0) return;
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    card.style.setProperty('--ry', (px * 7).toFixed(2) + 'deg');
    card.style.setProperty('--rx', (-py * 7).toFixed(2) + 'deg');
  }, { passive: true });
  document.addEventListener('mouseout', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.floating-card, .dragon-card') : null;
    if (card && !(e.relatedTarget && card.contains(e.relatedTarget))) {
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
    }
  }, { passive: true });
}

    { id: 'qianqiu', title: '千秋大梦', author: '亦廾', cover: 'song/cover2.jpg', audio: 'song/song2.m4a', dur: 173, lyrics: '<div class="lyric-section tag-intro"><span class="lyric-tag">前奏</span><div class="lyric-lines"></div></div>\n<div class="lyric-section tag-verse"><span class="lyric-tag">主歌</span><div class="lyric-lines"><p>风起洛阳城</p><p>花落满长街</p><p>谁在灯火阑珊处回眸一瞥</p><p>提笔写春秋</p><p>墨色染岁月</p><p>故事里藏着你我的誓约</p><p>曾踏遍山河万里烟霞</p><p>看尽人间繁华与风沙</p><p>雪落长安道</p><p>月照旧时家</p><p>你眉间朱砂灼灼如画</p></div></div>\n<div class="lyric-section tag-chorus"><span class="lyric-tag">副歌</span><div class="lyric-lines"><p>这一场千秋大梦谁与共</p><p>愿化作长风万里送孤鸿</p><p>若今生不能与你相拥</p><p>就让思念随月光入梦</p></div></div>\n<div class="lyric-section tag-interlude"><span class="lyric-tag">间奏</span><div class="lyric-lines"></div></div>\n<div class="lyric-section tag-verse"><span class="lyric-tag">主歌</span><div class="lyric-lines"><p>又见那年桃花开满坡</p><p>你执伞走过青石巷陌</p><p>烟雨朦胧处你回眸一笑</p><p>便胜过人间景色无数</p></div></div>\n<div class="lyric-section tag-chorus"><span class="lyric-tag">副歌</span><div class="lyric-lines"><p>这一场千秋大梦谁与共</p><p>愿化作长风万里送孤鸿</p><p>若来世还能与你相逢</p><p>我愿化作青山守候你影踪</p></div></div>\n<div class="lyric-section tag-outro"><span class="lyric-tag">尾奏</span><div class="lyric-lines"><p>梦里不知身是客</p><p>一晌贪欢终成空</p><p>唯有那轮明月依旧</p><p>照着你我 千年的梦</p></div></div>' },
    { id: 'qingna', title: '轻拿轻放', author: '亦廾', cover: 'song/cover.jpg', audio: 'song/song.m4a', dur: 203, lyrics: '<div class="lyric-section tag-intro"><span class="lyric-tag">前奏</span><div class="lyric-lines"></div></div>\n<div class="lyric-section tag-verse"><span class="lyric-tag">主歌</span><div class="lyric-lines"><p>你说这周搬家 问我有没有空</p><p>反正我有车</p><p>你说得理直气壮</p><p>我说好啊</p><p>好得不太像帮忙</p><p>倒像是终于</p><p>等到了什么一样</p><p>[pre-chorus]</p><p>你封箱熟练</p><p>胶带都撕得狂妄</p><p>回头叮嘱我 这几箱轻点</p><p>易碎朝上</p></div></div>\n<div class="lyric-section tag-chorus"><span class="lyric-tag">副歌</span><div class="lyric-lines"><p>轻拿 轻放</p><p>你对纸箱 都比对我善良</p><p>轻拿 轻放</p><p>装得下的归你 装不下的我扛</p></div></div>\n<div class="lyric-section tag-verse"><span class="lyric-tag">主歌</span><div class="lyric-lines"><p>你用马克笔</p><p>给每个箱子起名字</p><p>厨房 冬装</p><p>字迹还是那么漂亮</p><p>只有一箱写杂物</p><p>你说这箱随便放</p><p>可里面每一样</p><p>订单都还在我手机上</p><p>[pre-chorus]</p><p>到你新家楼下</p><p>有人小跑来帮忙</p><p>我低下头去</p><p>假装还在研究导航</p></div></div>\n<div class="lyric-section tag-chorus"><span class="lyric-tag">副歌</span><div class="lyric-lines"><p>轻拿 轻放</p><p>你对纸箱 都比对我善良</p><p>轻拿 轻放</p><p>装得下的归你 装不下的我扛</p></div></div>\n<div class="lyric-section tag-interlude"><span class="lyric-tag">间奏</span><div class="lyric-lines"></div></div>\n<div class="lyric-section tag-bridge"><span class="lyric-tag">桥段</span><div class="lyric-lines"><p>最后你清点完 说差不多了</p><p>那箱杂物别搬了</p><p>新家放不下</p><p>我说好 正顺路 我拿去扔了</p><p>垃圾站三公里 我开了一晚上</p></div></div>\n<div class="lyric-section tag-chorus"><span class="lyric-tag">副歌</span><div class="lyric-lines"><p>轻拿 轻放</p><p>你不要的那箱</p><p>我捡得理直气壮</p><p>轻拿 轻放</p><p>这四个字 这一次</p><p>我写在箱上</p></div></div>\n<div class="lyric-section tag-outro"><span class="lyric-tag">尾奏</span><div class="lyric-lines"><p>后备箱的东西终于有了存放</p><p>而我从此只能流浪</p></div></div>' },
  ];
  var curSong = SONGS[0];

  function readState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { return null; }
  }
  function writeState() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        playing: !audio.paused, t: audio.currentTime, ts: Date.now(), songId: curSong.id, v: 1
      }));
    } catch (e) {}
  }
  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  var audio = new Audio(SONGS[0].audio);
  audio.preload = 'auto';

  // --- 悬浮窗 ---
  var wrap = document.createElement('div');
  wrap.className = 'mini-player';
  wrap.innerHTML = '<img src="song/cover2.jpg" alt="千秋大梦封面" id="miniCover">'
    + '<div class="mini-info"><div class="mini-title" id="miniTitle">千秋大梦</div>'
    + '<div class="mini-sub">亦廾 · 海绵音乐</div></div>'
    + '<button class="mini-btn" id="miniPlayBtn" aria-label="播放/暂停">▶</button>'
    + '<button class="mini-close" id="miniClose" aria-label="关闭">×</button>';
  document.body.appendChild(wrap);
  var miniPlayBtn = wrap.querySelector('#miniPlayBtn');
  var miniClose = wrap.querySelector('#miniClose');

  function refreshMini() {
    wrap.querySelector('#miniCover').src = curSong.cover;
    wrap.querySelector('#miniTitle').textContent = curSong.title;
    miniPlayBtn.textContent = audio.paused ? '▶' : '❚❚';
  }
  function showMini() {
    wrap.classList.add('show');
    refreshMini();
  }
  miniPlayBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) { audio.play().catch(function () {}); }
    else { audio.pause(); }
    refreshMini(); writeState();
  });
  miniClose.addEventListener('click', function (e) {
    e.stopPropagation();
    audio.pause();
    wrap.classList.remove('show');
    try { localStorage.removeItem(LS_KEY); } catch (e2) {}
  });
  wrap.addEventListener('click', function (e) {
    if (e.target === wrap || e.target.classList.contains('mini-info') || e.target.tagName === 'IMG') {
      openLayer();
    }
  });

  // --- 听歌覆盖层（懒创建） ---
  var layer = null;
  function buildLayer() {
    if (layer) return;
    layer = document.createElement('div');
    layer.className = 'song-layer';
    layer.innerHTML =
      '<button class="song-close" id="songClose" aria-label="关闭">×</button>'
      + '<div class="song-content">'
      + '<div class="song-head">'
      + '<div class="song-list" id="songList"></div>'
      + '<div class="cover-box"><img src="song/cover2.jpg" alt="歌曲封面" id="songCover"></div>'
      + '<h2 id="songTitle">千秋大梦</h2><div class="sub" id="songSub">亦廾 · 海绵音乐 AI 创作</div>'
      + '</div>'
      + '<div class="song-player">'
      + '<div class="row">'
      + '<button class="song-play" id="songPlayBtn" aria-label="播放">▶</button>'
      + '<div class="info"><div class="t1" id="songPTitle">千秋大梦</div><div class="t2" id="songState">点击播放键开始收听</div></div>'
      + '</div>'
      + '<div class="song-progress-row">'
      + '<span class="t" id="songCur">0:00</span>'
      + '<input type="range" class="song-progress" id="songProgress" min="0" max="173" step="0.1" value="0">'
      + '<span class="t" id="songDur">2:53</span>'
      + '</div>'
      + '</div>'
      + '<div class="song-lyrics"><div class="t">— 歌 词 —</div><div id="songLyrics">' + SONGS[0].lyrics + '</div></div>'
      + '<div class="song-footer">《千秋大梦》《轻拿轻放》· 用 <a href="https://www.haimian.com" target="_blank" rel="noopener">海绵音乐</a> 创作 · <a href="song/" target="_blank" rel="noopener">独立页面</a></div>'
      + '</div>';
    document.body.appendChild(layer);

    var playBtn = layer.querySelector('#songPlayBtn');
    var progress = layer.querySelector('#songProgress');
    var curEl = layer.querySelector('#songCur');
    var stateEl = layer.querySelector('#songState');
    var closeBtn = layer.querySelector('#songClose');
    var songList = layer.querySelector('#songList');

    // 歌单渲染
    function renderSongList() {
      var html = '';
      for (var i = 0; i < SONGS.length; i++) {
        var s = SONGS[i];
        html += '<div class="song-item' + (s.id === curSong.id ? ' active' : '') + '" data-song="' + s.id + '">'
          + '<img src="' + s.cover + '" alt="' + s.title + '">'
          + '<div class="song-item-info"><div class="n">' + s.title + '</div><div class="a">亦廾</div></div>'
          + '</div>';
      }
      songList.innerHTML = html;
      var items = songList.querySelectorAll('.song-item');
      for (var j = 0; j < items.length; j++) {
        items[j].addEventListener('click', function (e) {
          var id = this.getAttribute('data-song');
          switchSong(id);
          if (audio.paused) { audio.play().catch(function () {}); }
          refreshPlayBtn(); writeState();
        });
      }
    }
    function switchSong(id) {
      for (var i = 0; i < SONGS.length; i++) {
        if (SONGS[i].id === id) { curSong = SONGS[i]; break; }
      }
      audio.src = curSong.audio;
      audio.load();
      layer.querySelector('#songCover').src = curSong.cover;
      layer.querySelector('#songTitle').textContent = curSong.title;
      layer.querySelector('#songPTitle').textContent = curSong.title;
      layer.querySelector('#songLyrics').innerHTML = curSong.lyrics;
      progress.max = curSong.dur;
      layer.querySelector('#songDur').textContent = fmt(curSong.dur);
      curEl.textContent = '0:00';
      progress.value = 0;
      renderSongList();
    }
    function refreshPlayBtn() {
      playBtn.textContent = audio.paused ? '▶' : '❚❚';
      stateEl.textContent = audio.paused ? '点击播放键开始收听' : '正在播放 · 关闭此页音乐会继续';
    }
    playBtn.addEventListener('click', function () {
      if (audio.paused) { audio.play().catch(function () {}); }
      else { audio.pause(); }
      refreshPlayBtn(); writeState();
    });
    closeBtn.addEventListener('click', closeLayer);
    layer.addEventListener('click', function (e) { if (e.target === layer) closeLayer(); });
    audio.addEventListener('play', refreshPlayBtn);
    audio.addEventListener('pause', refreshPlayBtn);
    audio.addEventListener('ended', function () { refreshPlayBtn(); writeState(); });
    audio.addEventListener('timeupdate', function () {
      curEl.textContent = fmt(audio.currentTime);
      progress.value = audio.currentTime;
    });
    progress.addEventListener('input', function () { curEl.textContent = fmt(+progress.value); });
    progress.addEventListener('change', function () {
      audio.currentTime = +progress.value;
      writeState();
    });
    renderSongList();
  }
  function openLayer() {
    buildLayer();
    layer.classList.add('show');
    document.body.style.overflow = 'hidden';
    var playBtn = layer.querySelector('#songPlayBtn');
    playBtn.textContent = audio.paused ? '▶' : '❚❚';
    wrap.classList.remove('show');
  }
  function closeLayer() {
    layer.classList.remove('show');
    document.body.style.overflow = '';
    if (!audio.paused) showMini();
  }

  // --- 简历项目卡"立即听歌"按钮 → 打开覆盖层 ---
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href="song/"]') : null;
    if (a) {
      e.preventDefault();
      openLayer();
    }
  });

  // --- 状态同步 ---
  setInterval(function () { if (!audio.paused) writeState(); }, 3000);
  window.addEventListener('pagehide', writeState);

  // --- 进入页面：续播恢复（按歌曲） ---
  var st = readState();
  if (st && st.playing && st.v === 1 && (Date.now() - st.ts) < 90000) {
    for (var k = 0; k < SONGS.length; k++) {
      if (SONGS[k].id === st.songId) { curSong = SONGS[k]; break; }
    }
    audio.src = curSong.audio;
    audio.load();
    audio.currentTime = Math.min(st.t + (Date.now() - st.ts) / 1000, curSong.dur);
    audio.play().then(function () {
      showMini();
    }).catch(function () {
      showMini();
    });
  }
})();

</script>
